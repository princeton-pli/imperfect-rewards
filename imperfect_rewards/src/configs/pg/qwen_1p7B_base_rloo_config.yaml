do_pg: true
do_rm_eval: false

cache_dir: 
seed: -1

pg_config:
  output_dir_base: outputs/rloo_open_rms/qwen1p7B
  do_train: true
  algorithm_name: "RLOO"
  bf16: false
  fp16: false
  dataset_path: FILL_PATH_TO_RELABELED_DATASET_HERE
  load_dataset_from_file: true
  num_train_samples: -1
  data_selection_seed: 872
  dataset_train_split: "train_rlhf_prefs"
  dataset_test_split: "test_prefs"
  dataset_num_proc: 1
  reward_model_path: FILL_PATH_TO_REWARD_MODEL
  use_reward_model_tokenizer: true
  path_to_precomputed_rewards_for_normalization:
  language_model_path: Qwen/Qwen3-1.7B-Base
  eval_final_policy_at_end: false
  delete_language_model_checkpoint_after_eval: true
  trust_remote_code: true
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 4
  num_train_epochs: 8 # num_train_epochs / rloo_k = number of passes through the data
  total_episodes: # total_episodes = int(args.num_train_epochs * self.train_dataset_len) automatically
  eval_strategy: "steps"
  eval_on_start: true
  eval_steps: 40
  save_strategy: "steps"
  save_steps: 0.25
  save_only_model: true
  report_to: "tensorboard"
  logging_steps: 25
  learning_rate: 0.0000001
  lr_scheduler_type: "constant"
  warmup_ratio: 0.0
  use_lora: false
  lora_rank: 32
  algo_specific:
    num_ppo_epochs: 1
    num_mini_batches: 1
    kl_coef: 0.01
    temperature: 1
    rloo_k: 4
    response_length: 512
    whiten_rewards: true
    whiten_rewards_without_kl: true
    missing_eos_penalty: 0.0
    num_sample_generations: 10
    early_stopping: false
    target_kl: 4
    kl_smoothing_interval_for_early_stopping: 50
    per_prompt_normalize_rewards: false


# Will use this configuration to evaluate the trained policy if 'eval_final_policy_at_end' is true
rm_eval_config:
  only_lm_eval: true
  output_dir_base: "" # Automatically taken from the policy gradient config (can keep empty)
  language_model_path: "" # Automatically set to the trained policy (can keep empty)
  is_lora_lm: false # Automatically set based on pg_config (can keep false)
  lora_base_language_model_path: "" # Automatically set based on pg_config (can keep empty)"
  proxy_reward_models: [ "" ] # Automatically set to the reward model used for training the policy (can keep empty)
  save_generated_responses: true
  ground_truth_reward_model_path: RLHFlow/ArmoRM-Llama3-8B-v0.1
  dataset_paths: [ "" ] # Automatically set to dataset used for policy gradient if empty
  load_dataset_from_file_flags: [ true ]
  train_splits: [ "train_rlhf_prefs" ]
  test_splits: [ "test_prefs" ]
  num_train_samples: [ 500 ]
  num_test_samples: [ 500 ]
  data_selection_seed: 546
  rm_batch_size: 16
  lm_batch_size: 4
  generation_config:
    temperature: 1
    #    max_length: 512
    max_new_tokens: 512
    do_sample: true
    num_return_sequences: 10